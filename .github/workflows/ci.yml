name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:shell
      - run: npm run test:providers
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: |
            build/com.alpinesox.cabundlemanager.ipk
            build/manifest.json
